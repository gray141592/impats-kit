/* ===== tokens.css ===== */
/* Design tokens. These become the production tokens module: change values here only. */
:root {
  /* text scale: the DEMO "Text size" control changes this (accessibility large text) */
  --text-scale: 1;

  /* colour */
  --color-bg: #1a1917;
  --color-surface: #252320;
  --color-surface-2: #33302c;
  --color-surface-glass: rgba(37, 35, 32, 0.82);
  --color-border: rgba(243, 237, 228, 0.09);
  --color-text: #f3ede4;
  --color-text-muted: #a49d92;
  --color-primary: #f0872f;
  --color-primary-soft: rgba(240, 135, 47, 0.14);
  --color-on-primary: #1a1917;
  --color-success: #41c383;
  --color-danger: #ff5d62;
  --color-danger-soft: rgba(255, 93, 98, 0.12);
  --color-scrim: rgba(0, 0, 0, 0.62);
  --color-photo-glass: rgba(26, 25, 23, 0.72);

  /* type */
  --font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-xs: calc(12px * var(--text-scale));
  --font-sm: calc(14px * var(--text-scale));
  --font-md: calc(16px * var(--text-scale));
  --font-lg: calc(19px * var(--text-scale));
  --font-xl: calc(25px * var(--text-scale));
  --font-2xl: calc(34px * var(--text-scale));
  --weight-regular: 400;
  --weight-medium: 600;
  --weight-bold: 700;
  --weight-heavy: 800;
  --line-tight: 1.15;
  --line-body: 1.5;
  --tracking-tight: -0.02em;

  /* spacing: 4 px scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  /* radii */
  --radius-s: 10px;
  --radius-m: 14px;
  --radius-l: 22px;
  --radius-xl: 30px;
  --radius-pill: 999px;

  /* sizes */
  --size-tap: 52px;
  --size-icon: 20px;
  --size-icon-lg: 26px;
  --size-thumb: 28px;
  --size-card-photo: 216px;
  --size-hero: 400px;
  --size-logo: 64px;
  --size-avatar: 60px;
  --size-tabbar: 66px;

  /* effects */
  --blur-glass: blur(18px) saturate(1.4);
  --shadow-float: 0 12px 36px rgba(0, 0, 0, 0.55);
}
</style>
<style>
/* ===== styles.css ===== */
/* Prototype styles. App styles use tokens only; the stage, phone frame, keyboard and DEMO panel are scaffolding. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #dcdce0; font-family: var(--font-family); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input { font: inherit; color: inherit; }

/* ---------- scaffolding: stage, phone frame, keyboard, DEMO panel ---------- */
.stage { display: flex; flex-wrap: wrap; gap: 20px; padding: 12px; align-items: flex-start; justify-content: center; }
.phone { width: 390px; height: 844px; flex: none; background: var(--color-bg); border-radius: 48px; border: 8px solid #000; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.phone.se { width: 375px; height: 667px; border-radius: 32px; }
.statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; color: var(--color-text); font: 600 15px -apple-system, sans-serif; position: relative; z-index: 6; pointer-events: none; }
.phone.se .statusbar { height: 24px; font-size: 12px; }
.homebar { height: 22px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--color-bg); }
.homebar i { width: 130px; height: 5px; border-radius: 3px; background: var(--color-text); opacity: .8; }
.phone.se .homebar { display: none; }
.phone.kb .homebar { background: #2b2b2e; }

#kb { display: none; flex: none; background: #2b2b2e; padding: 8px 3px 4px; font: 400 21px -apple-system, sans-serif; color: #fff; user-select: none; }
.phone.kb #kb { display: block; }
.phone.kb .tabbar { display: none; }
#kb .kr { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; }
#kb .kr.mid { padding: 0 19px; }
#kb button { flex: 1; height: 42px; border-radius: 5px; background: #6b6b70; text-align: center; box-shadow: 0 1px 0 #111; }
#kb button.fn { background: #47474b; flex: 1.5; font-size: 15px; }
#kb button.space { flex: 5; font-size: 15px; }
#kb button.ret { flex: 2.4; background: #0a84ff; font-size: 15px; }

.demo { width: 330px; flex: 1 1 330px; max-width: 460px; background: #fff; color: #18181b; border-radius: 12px; padding: 14px; font: 13px/1.4 -apple-system, sans-serif; }
.demo h2 { margin: 0 0 2px; font-size: 13px; letter-spacing: .08em; color: #c2410c; }
.demo h3 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #71717a; }
.demo p { margin: 4px 0; color: #52525b; }
.demo .row { display: flex; flex-wrap: wrap; gap: 6px; }
.demo button { border: 1px solid #d4d4d8; border-radius: 6px; padding: 5px 9px; background: #fafafa; font-size: 12px; }
.demo button:hover { background: #f0f0f2; }
.demo button.on { background: #18181b; color: #fff; border-color: #18181b; }
.demo code { background: #f4f4f5; padding: 1px 4px; border-radius: 4px; }

/* ---------- app ---------- */
#app { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; color: var(--color-text); font-size: var(--font-md); line-height: var(--line-body); -webkit-font-smoothing: antialiased; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar, .sheet-body::-webkit-scrollbar, .carousel::-webkit-scrollbar { display: none; }
.scroll.tabbed > .pad { padding-bottom: calc(var(--size-tabbar) + var(--space-8)); }
.pad { padding: var(--space-5); }
.stack { display: flex; flex-direction: column; gap: var(--space-5); }
.stack-s { display: flex; flex-direction: column; gap: var(--space-2); }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--space-8); gap: var(--space-3); }
.center > .ic { color: var(--color-text-muted); margin-bottom: var(--space-2); }
.muted { color: var(--color-text-muted); }
.small { font-size: var(--font-sm); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: var(--font-2xl); line-height: var(--line-tight); font-weight: var(--weight-heavy); letter-spacing: var(--tracking-tight); }
h1.sub { font-size: var(--font-xl); }
h2 { font-size: var(--font-lg); line-height: var(--line-tight); font-weight: var(--weight-bold); letter-spacing: var(--tracking-tight); }
h3 { font-size: var(--font-md); font-weight: var(--weight-bold); }
b { font-weight: var(--weight-bold); }

.ic { width: var(--size-icon); height: var(--size-icon); flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.ic.lg { width: var(--size-icon-lg); height: var(--size-icon-lg); }
.ic.xl { width: var(--space-10); height: var(--space-10); stroke-width: 1.4; }

/* header */
.header { flex: none; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-5) var(--space-4); flex-wrap: wrap; }
.header .grow { flex: 1; min-width: 0; }
.iconbtn { width: var(--size-tap); height: var(--size-tap); border-radius: var(--radius-pill); display: inline-flex; align-items: center; justify-content: center; background: var(--color-surface); border: 1px solid var(--color-border); flex: none; position: relative; }
.iconbtn.ghost { background: none; border: 0; }
.iconbtn[disabled] { opacity: .4; cursor: default; }
.iconbtn.spin .ic { animation: spin 0.9s linear infinite; }
.iconbtn .count-pill { position: absolute; top: calc(var(--space-1) * -1); right: calc(var(--space-1) * -1); }

/* buttons */
.btn { min-height: var(--size-tap); padding: var(--space-3) var(--space-6); border-radius: var(--radius-pill); background: var(--color-primary); color: var(--color-on-primary); font-weight: var(--weight-bold); display: flex; align-items: center; justify-content: center; gap: var(--space-2); text-align: center; width: 100%; transition: transform .1s; }
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--color-surface-2); color: var(--color-text); }
.btn.danger { background: var(--color-danger); }
.btn.auto { width: auto; flex: none; }
.btn[disabled] { background: var(--color-surface-2); color: var(--color-text-muted); cursor: default; }
.btn-row { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.btn-row .btn:not(.auto) { flex: 1; width: auto; }
.link { color: var(--color-primary); font-weight: var(--weight-medium); min-height: var(--size-tap); display: inline-flex; align-items: center; gap: var(--space-2); }
.link.danger { color: var(--color-danger); }
.spinner { width: var(--size-icon); height: var(--size-icon); border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; flex: none; }
.spinner.lg { width: var(--size-icon-lg); height: var(--size-icon-lg); color: var(--color-primary); }
@keyframes spin { to { transform: rotate(360deg); } }

/* fields */
.field label, .label { display: block; font-size: var(--font-sm); font-weight: var(--weight-medium); color: var(--color-text-muted); margin-bottom: var(--space-2); }
.input { display: flex; align-items: center; background: var(--color-surface); border: 1.5px solid var(--color-border); border-radius: var(--radius-m); min-height: calc(var(--size-tap) + var(--space-1)); transition: border-color .15s; }
.input:focus-within { border-color: var(--color-primary); }
.input.invalid { border-color: var(--color-danger); }
.input input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; padding: var(--space-3) var(--space-4); }
.input input::placeholder { color: var(--color-text-muted); opacity: .6; }
.err { color: var(--color-danger); font-size: var(--font-sm); min-height: calc(var(--font-sm) * 1.5); margin: var(--space-1) 0 var(--space-2); }
.hint { color: var(--color-text-muted); font-size: var(--font-sm); margin: var(--space-1) 0 var(--space-2); }
.notice { border-radius: var(--radius-m); padding: var(--space-3) var(--space-4); font-size: var(--font-sm); display: flex; gap: var(--space-3); align-items: flex-start; }
.notice .ic { margin-top: 1px; }
.notice.error { background: var(--color-danger-soft); } .notice.error .ic { color: var(--color-danger); }
.notice.info { background: var(--color-surface); }
.notice.warn { background: var(--color-primary-soft); } .notice.warn .ic { color: var(--color-primary); }
.notice-slot { min-height: var(--size-tap); }

.seg { display: flex; flex-wrap: wrap; gap: var(--space-1); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-m); padding: var(--space-1); }
.seg button { flex: 1 1 auto; min-height: calc(var(--size-tap) - var(--space-2)); padding: var(--space-2) var(--space-3); border-radius: var(--radius-s); text-align: center; color: var(--color-text-muted); font-weight: var(--weight-medium); }
.seg button.on { background: var(--color-primary); color: var(--color-on-primary); font-weight: var(--weight-bold); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip { min-height: calc(var(--size-tap) - var(--space-2)); padding: var(--space-2) var(--space-4); border-radius: var(--radius-pill); background: var(--color-surface); border: 1px solid var(--color-border); display: inline-flex; align-items: center; gap: var(--space-2); font-weight: var(--weight-medium); }
.chip.on { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); font-weight: var(--weight-bold); }
.chip.mini { min-height: var(--space-8); padding: var(--space-1) var(--space-3); font-size: var(--font-sm); }
.chip.mini .ic { width: var(--space-3); height: var(--space-3); stroke-width: 2.6; }
.chip.mini.on { background: var(--color-primary-soft); color: var(--color-primary); border-color: transparent; }

.slider-value { font-size: var(--font-2xl); font-weight: var(--weight-heavy); letter-spacing: var(--tracking-tight); line-height: var(--line-tight); }
.slider-value.unset { color: var(--color-text-muted); font-weight: var(--weight-regular); font-size: var(--font-md); line-height: calc(var(--font-2xl) * 1.15); letter-spacing: 0; }
input[type=range].single { width: 100%; height: var(--size-tap); accent-color: var(--color-primary); margin: 0; }
.range-labels { display: flex; justify-content: space-between; font-size: var(--font-sm); color: var(--color-text-muted); }
.range-labels b { color: var(--color-text); font-size: var(--font-lg); }
.dual { position: relative; height: var(--size-tap); }
.dual-track { position: absolute; left: 0; right: 0; top: 50%; height: var(--space-1); margin-top: calc(var(--space-1) / -2); background: var(--color-surface-2); border-radius: var(--radius-pill); }
.dual-fill { position: absolute; top: 0; bottom: 0; background: var(--color-primary); border-radius: var(--radius-pill); }
.dual input { position: absolute; left: 0; top: 50%; width: 100%; height: var(--size-thumb); margin: calc(var(--size-thumb) / -2) 0 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.dual input::-webkit-slider-runnable-track { background: none; height: var(--size-thumb); }
.dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: var(--size-thumb); height: var(--size-thumb); border-radius: 50%; background: var(--color-text); border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.5); cursor: pointer; }
.dual input::-moz-range-thumb { pointer-events: auto; width: var(--size-thumb); height: var(--size-thumb); border-radius: 50%; background: var(--color-text); border: 0; cursor: pointer; }

.switch { width: 52px; height: 32px; border-radius: var(--radius-pill); background: var(--color-surface-2); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--color-text); transition: transform .15s; }
.switch.on { background: var(--color-primary); }
.switch.on::after { transform: translateX(20px); }

.price { font-weight: var(--weight-heavy); letter-spacing: var(--tracking-tight); white-space: nowrap; }
.price small { color: var(--color-text-muted); font-weight: var(--weight-regular); font-size: var(--font-sm); letter-spacing: 0; }
.meta { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--color-text-muted); font-size: var(--font-sm); overflow-wrap: anywhere; }
.meta .ic { width: var(--space-4); height: var(--space-4); margin-top: 2px; }
.facts-line { font-size: var(--font-sm); overflow-wrap: anywhere; }
.facts-line i { font-style: normal; color: var(--color-text-muted); margin: 0 var(--space-1); }
.glass { background: var(--color-photo-glass); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); color: var(--color-text); }
.photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-none { width: 100%; height: 100%; background: var(--color-surface); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: var(--space-2); color: var(--color-text-muted); font-size: var(--font-sm); }
.count-pill { background: var(--color-primary); color: var(--color-on-primary); border-radius: var(--radius-pill); min-width: var(--space-5); height: var(--space-5); padding: 0 var(--space-1); font-size: var(--font-xs); font-weight: var(--weight-bold); display: inline-flex; align-items: center; justify-content: center; }
.banner { display: flex; gap: var(--space-2); align-items: center; background: var(--color-surface-2); border-radius: var(--radius-m); padding: var(--space-3) var(--space-4); font-size: var(--font-sm); }
.skel { background: var(--color-surface); border-radius: var(--radius-l); height: var(--size-card-photo); animation: pulse 1.2s ease-in-out infinite; flex: none; }
.skel.line { height: var(--space-5); width: 70%; border-radius: var(--radius-s); margin-top: calc(var(--space-2) * -1); }
@keyframes pulse { 50% { opacity: .5; } }

.group { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-l); }
.rowi { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); min-height: calc(var(--size-tap) + var(--space-1)); width: 100%; }
.rowi + .rowi { border-top: 1px solid var(--color-border); }
.rowi .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rowi > .ic { color: var(--color-text-muted); }
.rowi .val { font-weight: var(--weight-medium); text-align: right; }
.rowi .lab { color: var(--color-text-muted); }
.section-head { display: flex; justify-content: space-between; align-items: center; min-height: var(--size-tap); }
.avatar { width: var(--size-avatar); height: var(--size-avatar); border-radius: 50%; background: var(--color-primary); color: var(--color-on-primary); display: flex; align-items: center; justify-content: center; font-weight: var(--weight-heavy); font-size: var(--font-lg); flex: none; }
.logo { width: var(--size-logo); height: var(--size-logo); border-radius: var(--radius-l); background: #fff; object-fit: cover; }
.logo.big { width: calc(var(--size-logo) * 1.5); height: calc(var(--size-logo) * 1.5); border-radius: var(--radius-xl); }
.steps { display: flex; gap: var(--space-1); margin-top: var(--space-2); }
.steps i { flex: 1; height: var(--space-1); border-radius: var(--radius-pill); background: var(--color-surface-2); }
.steps i.on { background: var(--color-primary); }

/* floating tab bar */
.tabbar { position: absolute; left: var(--space-5); right: var(--space-5); bottom: var(--space-2); z-index: 5; min-height: var(--size-tabbar); display: flex; padding: var(--space-2); gap: var(--space-1); background: var(--color-surface-glass); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); border: 1px solid var(--color-border); border-radius: var(--radius-pill); box-shadow: var(--shadow-float); }
.tabbar button { flex: 1; display: flex; align-items: center; justify-content: center; gap: var(--space-2); font-size: var(--font-sm); font-weight: var(--weight-medium); color: var(--color-text-muted); border-radius: var(--radius-pill); padding: var(--space-2); flex-wrap: wrap; }
.tabbar button span { display: none; }
.tabbar button.on { background: var(--color-primary); color: var(--color-on-primary); flex: 1.9; font-weight: var(--weight-bold); }
.tabbar button.on span { display: inline; }

/* details */
.hero { height: var(--size-hero); position: relative; flex: none; margin-top: -44px; background: var(--color-surface); }
.phone.se .hero { margin-top: -24px; height: calc(var(--size-hero) * .8); }
.hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 110px; background: linear-gradient(var(--color-scrim), transparent); z-index: 1; pointer-events: none; }
.carousel { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.carousel > * { flex: 0 0 100%; scroll-snap-align: start; height: 100%; position: relative; }
.hero .over { position: absolute; z-index: 3; }
.hero .over.back { top: 52px; left: var(--space-4); }
.phone.se .hero .over.back { top: 32px; }
.hero .iconbtn { border: 0; }
.tapzone { position: absolute; z-index: 2; top: 110px; bottom: 80px; width: 26%; }
.tapzone.prev { left: 0; } .tapzone.next { right: 0; }
.hero-bar { position: absolute; z-index: 3; left: var(--space-4); right: var(--space-4); bottom: calc(var(--radius-xl) + var(--space-3)); display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); pointer-events: none; }
.hero-bar > * { pointer-events: auto; }
.pill { border-radius: var(--radius-pill); padding: var(--space-2) var(--space-3); font-size: var(--font-sm); font-weight: var(--weight-medium); display: inline-flex; gap: var(--space-2); align-items: center; white-space: nowrap; }
.dots { display: flex; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-pill); }
.dots button { width: var(--space-2); height: var(--space-2); border-radius: var(--radius-pill); background: var(--color-text); opacity: .45; transition: width .2s, opacity .2s; }
.dots button.on { opacity: 1; width: var(--space-5); }
.det-body { position: relative; z-index: 3; margin-top: calc(var(--radius-xl) * -1); background: var(--color-bg); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: var(--space-6) var(--space-5); display: flex; flex-direction: column; gap: var(--space-6); }
.video { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); text-align: center; padding: var(--space-6); }
.playbtn { width: var(--size-avatar); height: var(--size-avatar); border-radius: 50%; background: var(--color-text); color: var(--color-bg); display: flex; align-items: center; justify-content: center; }
.progress { position: absolute; left: var(--space-5); right: var(--space-5); bottom: calc(var(--radius-xl) + var(--space-10) + var(--space-5)); height: var(--space-1); background: var(--color-surface-2); border-radius: var(--radius-pill); overflow: hidden; }
.progress i { display: block; height: 100%; width: 100%; background: var(--color-primary); transform-origin: left; animation: play 20s linear forwards; }
@keyframes play { from { transform: scaleX(0); } }
.stats { display: flex; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-l); flex-wrap: wrap; }
.stat { flex: 1 1 30%; padding: var(--space-4) var(--space-3); text-align: center; }
.stat + .stat { border-left: 1px solid var(--color-border); }
.stat b { display: block; font-size: var(--font-lg); letter-spacing: var(--tracking-tight); overflow-wrap: anywhere; }

</style>

function validate(d, parts) {
  const e = {};
  if (parts.includes('about')) { if (!d.firstName.trim()) e.firstName = 'First name is required'; if (!d.lastName.trim()) e.lastName = 'Last name is required'; }
  if (parts.includes('household')) { if (!d.family) e.family = 'Choose your household'; if (!d.income) e.income = 'Set your net income'; }
  if (parts.includes('search')) { if (!d.rent) e.rent = 'Set the rent you are looking for'; if (!d.rooms.length) e.rooms = 'Select at least one room option'; if (d.furnished == null) e.furnished = 'Choose furnished or unfurnished'; }
  return e;
}

      <div class="stats"><div class="stat">${ic('wallet', 'lg')}<b>${sliderText(S.user.income, 10000)}</b><span class="muted small">Your net income / month</span></div>
        <div class="stat">${ic('home', 'lg')}<b>${eur(a.price)}</b><span class="muted small">Rent / month</span></div></div>
      <div class="notice warn">${ic('doc')}<span>You get a viewing appointment after providing <b>all required documents</b>.</span></div>
      ${S.formError ? `<div class="notice error">${ic('alert')}<span>${esc(S.formError)}</span></div>` : ''}
      ${btn(S.busy ? 'Sending…' : 'Send request', 'requestViewing', { busyable: true })}${btn('Cancel', 'closeSheet', { cls: 'secondary' })}</div></div>`;
  },
  password: () => {
    const t = S.pw.show ? 'text' : 'password';
    return `<div class="sheet">${sheetHead('Change password')}<div class="sheet-body" style="gap:0">
      ${textField('Current password', 'pw.current', { type: t })}${textField('New password', 'pw.next', { type: t, hint: 'At least 8 characters' })}${textField('Repeat new password', 'pw.confirm', { type: t, enter: 'changePassword' })}
      <button class="link" data-act="set" data-path="pw.show" data-val="${!S.pw.show}">${ic(S.pw.show ? 'eyeoff' : 'eye')}${S.pw.show ? 'Hide' : 'Show'} passwords</button>
      ${S.formError ? `<div class="notice error" style="margin-bottom:var(--space-3)">${ic('alert')}<span>${esc(S.formError)}</span></div>` : ''}
      ${btn(S.busy ? 'Saving…' : 'Save new password', 'changePassword', { busyable: true })}</div></div>`;
  },
  delete: () => `<div class="sheet">${sheetHead('Delete your account?')}<div class="sheet-body">
      <p>This action cannot be undone and you will lose access to all your data.</p>
      ${S.formError ? `<div class="notice error">${ic('alert')}<span>${esc(S.formError)}</span></div>` : ''}
      ${btn(S.busy ? 'Deleting…' : 'Delete account', 'deleteAccount', { cls: 'danger', busyable: true })}${btn('Cancel', 'closeSheet', { cls: 'secondary' })}</div></div>`,
  contact: () => `<div class="sheet">${sheetHead('Contact Impats')}<div class="sheet-body">
      <p>Accounts are created by Impats. If you cannot sign in, lost your password, or changed your phone, contact your Impats agent.</p>
      <div class="group"><div class="rowi kv"><span>Email</span><b>[support email, to be supplied]</b></div><div class="rowi kv"><span>Phone</span><b>[phone, to be supplied]</b></div></div>
      ${btn('Close', 'closeSheet', { cls: 'secondary' })}</div></div>`,
  perm: () => `<div class="alert"><div class="t"><b>“Impats” Would Like to Send You Notifications</b>Notifications may include alerts, sounds and icon badges.</div>
      <div class="b"><button data-act="perm" data-v="denied">Don’t Allow</button><button data-act="perm" data-v="granted">Allow</button></div></div>`,
};

/* ---------------- render ---------------- */
function render() {
  const app = $('#app'); // scroll positions are remembered across screens, so going back lands where you were
  app.querySelectorAll('[data-key]').forEach((el) => (tops[el.dataset.key] = el.scrollTop));
  app.innerHTML = SCREENS[S.route]() + (TABS.includes(S.route) ? tabbar() : '') + (S.sheet ? `<div class="scrim" data-act="closeSheet"></div>${SHEETS[S.sheet]()}` : '');
  app.querySelectorAll('[data-key]').forEach((el) => { if (tops[el.dataset.key]) el.scrollTop = tops[el.dataset.key]; });
  const car = $('#carousel');
  if (car) { car.scrollLeft = S.slide * car.clientWidth; car.addEventListener('scroll', onCarousel, { passive: true }); }
  syncDuals();
  $('#push').innerHTML = S.pushVisible ? `<button data-act="openPush"><img src="assets/icon.png" alt=""><span><b>Impats</b><br>2 new apartments match your preferences</span></button>` : '';
  $('#phone').classList.toggle('se', S.demo.small);
  document.documentElement.style.setProperty('--text-scale', S.demo.textScale);
  fit(); renderDemo(); syncKb();
}

/* On-screen keyboard: shows how a focused field sits above it. Keys type into the field; a real keyboard works too. */
const isText = (el) => el && el.tagName === 'INPUT' && el.type !== 'range' && el.closest('#app');
function syncKb() {
  const t = document.activeElement; const on = !!isText(t); const phone = $('#phone');
  if (on) {
    const email = t.type === 'email'; const k = (c, cls = '') => `<button class="${cls}" data-key="${c}">${c}</button>`;
    $('#kb').innerHTML = ['qwertyuiop', 'asdfghjkl'].map((r, i) => `<div class="kr ${i ? 'mid' : ''}">${[...r].map((c) => k(c)).join('')}</div>`).join('')
      + `<div class="kr"><button class="fn">⇧</button>${[...'zxcvbnm'].map((c) => k(c)).join('')}<button class="fn" data-key="del">⌫</button></div>`
      + `<div class="kr"><button class="fn">123</button>${email ? k('@') : ''}<button class="space" data-key=" ">space</button>${email ? k('.') : ''}<button class="ret" data-key="ret">${t.dataset.enter ? 'go' : 'return'}</button></div>`;
  }
  if (phone.classList.contains('kb') === on) return;
  phone.classList.toggle('kb', on);
  if (on) { // keep the focused field visible above the keyboard, as the real app must
    const box = t.closest('.sheet-body, .scroll'); if (!box) return;
    const r = t.getBoundingClientRect(); const b = box.getBoundingClientRect(); const z = +$('#phone').style.zoom || 1;
    if (r.bottom > b.bottom - 16) box.scrollTop += (r.bottom - b.bottom) / z + 24;
  }
}
document.addEventListener('focusin', syncKb);
document.addEventListener('focusout', () => setTimeout(syncKb, 0));
$('#kb').addEventListener('mousedown', (e) => e.preventDefault()); // keys must not take focus from the field
$('#kb').addEventListener('click', (e) => {
  const key = e.target.closest('[data-key]')?.dataset.key; const t = document.activeElement; if (!key || !isText(t)) return;
  if (key === 'ret') { if (t.dataset.enter) A[t.dataset.enter](); else t.blur(); return; }
  t.value = key === 'del' ? t.value.slice(0, -1) : t.value + key;
  t.dispatchEvent(new Event('input', { bubbles: true }));
});
function onCarousel(e) {
  const car = e.currentTarget; const i = Math.round(car.scrollLeft / car.clientWidth);
  if (i === S.slide) return; S.slide = i;
  const c = $('#slideCount'); if (c) c.textContent = `${i + 1} / ${car.children.length}`;
  document.querySelectorAll('.dots button').forEach((d, j) => d.classList.toggle('on', j === i));
}
function syncDuals() {
  if (S.sheet !== 'filter') return; const b = bounds(); const d = S.draft;
  [['price', b.pMin, b.pMax, eur], ['size', b.sMin, b.sMax, (v) => v + ' m²']].forEach(([k, min, max, f]) => {
    const span = max - min || 1; const fill = $(`[data-fill="${k}"]`); if (!fill) return;
    fill.style.left = ((d[k + 'Min'] - min) / span) * 100 + '%'; fill.style.right = (1 - (d[k + 'Max'] - min) / span) * 100 + '%';
    $(`[data-lo="${k}"]`).textContent = f(d[k + 'Min']); $(`[data-hi="${k}"]`).textContent = f(d[k + 'Max']);
  });
  const n = applyFilter(S.list.items, draftToFilter(d)).length; const cta = $('#filterCta');
  if (cta) cta.textContent = n ? `Show ${n} apartment${n === 1 ? '' : 's'}` : 'No apartments match';
}
function fit() { const h = (S.demo.small ? 667 : 844) + 16; $('#phone').style.zoom = Math.min(1, (window.innerHeight - 24) / h); }
function showErrors(e) {
  S.errors = e; render();
  const first = $('#app .err:not(:empty)'); if (first) first.closest('.field')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
const hasErr = (e) => Object.keys(e).length > 0;

/* ---------------- actions ---------------- */
const A = {
  back, tab: (d) => { if (d.route === 'apartments' && S.route === 'apartments') return; go(d.route); },
  set: (d) => { setPath(d.path, JSON.parse(d.val)); clearErr(d.path); render(); },
  tog: (d) => { const arr = getPath(d.path); const i = arr.indexOf(d.val); if (i < 0) arr.push(d.val); else arr.splice(i, 1); clearErr(d.path); render(); },
  togglePw: () => { S.form.showPw = !S.form.showPw; render(); },
  sheet: (d) => { S.sheet = d.name; S.formError = null; S.errors = {}; if (d.name === 'password') S.pw = { current: '', next: '', confirm: '', show: false }; render(); },
  closeSheet: () => { if (S.busy || S.sheet === 'perm') return; S.sheet = null; S.formError = null; S.errors = {}; render(); },
  demoToast: (d) => toast(d.msg),

  async signin() {
    const f = S.form; const e = {};
    if (!f.email.trim()) e.email = 'Enter your email'; else if (!/^\S+@\S+\.\S+$/.test(f.email.trim())) e.email = 'Enter a valid email address';
    if (!f.password) e.password = 'Enter your password';
    S.formError = null; if (hasErr(e)) return showErrors(e);
    S.errors = {}; S.busy = true; render();
    try { await request(900); } catch (x) { S.busy = false; S.formError = netMsg(x); return render(); }
    S.busy = false;
    const acc = ACCOUNTS.find((a) => a.email === f.email.trim().toLowerCase() && !a.deleted);
    if (!acc || acc.password !== f.password) S.formError = 'Email or password is incorrect.';
    else if (!acc.active) S.formError = 'This account is no longer active. Contact Impats if you think this is a mistake.';
    else if (acc.otherDevice) S.formError = 'This account is already in use on another phone. Contact Impats to move it to this one.';
    else { S.user = acc; S.session = acc.email; S.notice = null; S.form.password = ''; return afterSignIn(); }
    render();
  },
  logout: () => { signOut(); },

  onbBack: () => { S.onb.step--; S.errors = {}; S.formError = null; render(); },
  async onbNext() {
    const st = S.onb.step; const d = S.onb.d; const e = validate(d, [['about', 'household', 'search'][st]]);
    if (hasErr(e)) return showErrors(e);
    if (st < 2) { S.onb.step++; S.errors = {}; return render(); }
    S.busy = true; S.formError = null; render();
    try { await request(900); } catch (x) { S.busy = false; S.formError = netMsg(x); return render(); }
    S.busy = false; Object.assign(S.user, d, { rooms: [...d.rooms], profileCompleted: true });
    // Ask for the system permission in context, after the client chose alerts (legacy asked on a blank first screen).
    if (d.notifications && S.demo.perm === 'unasked') { S.sheet = 'perm'; S.afterPerm = 'finishOnb'; return render(); }
    finishOnb();
  },
  perm: (d) => { S.demo.perm = d.v; S.sheet = null; if (S.afterPerm === 'finishOnb') { S.afterPerm = null; return finishOnb(); } S.afterPerm = null; render(); },

  refresh: () => { if (!S.list.refreshing) loadList(S.list.loadedOnce ? 'refresh' : 'initial'); },
  retryList: () => loadList('initial'),
  openFilter: () => { const b = bounds(); const f = S.filter; S.draft = { ...f, hoods: [...f.hoods], rooms: [...f.rooms], features: [...f.features], priceMin: f.priceMin ?? b.pMin, priceMax: f.priceMax ?? b.pMax, sizeMin: f.sizeMin ?? b.sMin, sizeMax: f.sizeMax ?? b.sMax }; S.sheet = 'filter'; render(); },
  resetDraft: () => { const b = bounds(); S.draft = { ...emptyFilter(), priceMin: b.pMin, priceMax: b.pMax, sizeMin: b.sMin, sizeMax: b.sMax }; render(); },
  applyFilter: () => { S.filter = draftToFilter(S.draft); S.sheet = null; render(); const sc = $('#app .scroll'); if (sc) sc.scrollTop = 0; },
  resetFilter: () => { S.filter = emptyFilter(); render(); },
  dropChip: (d) => { const f = S.filter; if (d.k === 'price') f.priceMin = f.priceMax = null; else if (d.k === 'size') f.sizeMin = f.sizeMax = null; else if (d.k === 'furnished') f.furnished = null; else f[d.k] = f[d.k].filter((v) => v !== d.v); render(); },

  openApt: (d, el) => {
    const ph = el && el.querySelector('.card-photo'); if (ph) ph.style.viewTransitionName = 'apt-photo';
    morph(() => { S.detailId = d.id; S.descOpen = false; S.featOpen = null; S.slide = 0; S.video = 'idle'; S.newIds.delete(d.id); go('details', true); });
  },
  slide: (d) => A.slideTo({ i: S.slide + +d.d }),
  slideTo: (d) => { const car = $('#carousel'); if (!car) return; const i = Math.max(0, Math.min(car.children.length - 1, +d.i)); car.scrollTo({ left: i * car.clientWidth, behavior: 'smooth' }); },
  async playVideo() { S.video = 'loading'; render(); try { await request(800); S.video = S.demo.videoFails ? 'error' : 'playing'; } catch { S.video = 'error'; } render(); },
  stopVideo: () => { S.video = 'idle'; render(); },
  openPdf: () => { go('pdf', true); A.loadPdf(); },
  async loadPdf() { S.pdf = 'loading'; render(); try { await request(900); S.pdf = 'ok'; } catch { S.pdf = 'error'; } if (S.route === 'pdf') render(); },
  async requestViewing() {
    S.busy = true; S.formError = null; render();
    try { await request(900); } catch (x) { S.busy = false; S.formError = netMsg(x); return render(); }
    S.busy = false; S.sheet = null; S.user.viewings.push(S.detailId); render();
    toast(`Thank you ${S.user.firstName}, your viewing request has been sent.`, 'success');
  },

  editProfile: () => { const u = S.user; S.edit = { d: { firstName: u.firstName, lastName: u.lastName, company: u.company, family: u.family, income: u.income, rent: u.rent, rooms: [...u.rooms], furnished: u.furnished } }; go('editProfile', true); },
  async saveProfile() {
    const d = S.edit.d; const e = validate(d, ['about', 'household', 'search']); if (hasErr(e)) return showErrors(e);
    S.busy = true; S.formError = null; render();
    try { await request(900); } catch (x) { S.busy = false; S.formError = netMsg(x); return render(); }
    S.busy = false; Object.assign(S.user, d, { rooms: [...d.rooms] }); back(); toast('Profile updated', 'success');
  },
  async toggleNotif() {
    const u = S.user;
    if (u.notifications && S.demo.perm === 'denied') { S.demo.perm = 'granted'; render(); return toast('(Demo) The phone settings were opened and notifications allowed.'); }
    u.notifications = !u.notifications; render();
    try { await request(500); } catch (x) { u.notifications = !u.notifications; render(); return toast("Couldn't save. " + (x === 'offline' ? 'You are offline.' : 'Try again in a moment.'), 'error'); }
    if (u.notifications && S.demo.perm === 'unasked') { S.sheet = 'perm'; render(); }
  },
  async changePassword() {
    const p = S.pw; const e = {};
    if (!p.current) e.current = 'Enter your current password';
    if (!p.next) e.next = 'Enter a new password'; else if (p.next.length < 8) e.next = 'Use at least 8 characters';
    if (p.confirm !== p.next) e.confirm = 'The two new passwords do not match';
    S.formError = null; if (hasErr(e)) return showErrors(e);
    S.busy = true; render();
    try { await request(900); } catch (x) { S.busy = false; S.formError = netMsg(x); return render(); }
    S.busy = false;
    if (p.current !== S.user.password) return showErrors({ current: 'Current password is incorrect' }); // sheet stays open, typed values stay
    S.user.password = p.next; S.sheet = null; render(); toast('Password changed', 'success');
  },
  async deleteAccount() {
    S.busy = true; S.formError = null; render();
    try { await request(1000); } catch (x) { S.busy = false; S.formError = netMsg(x); return render(); }
    S.user.deleted = true; signOut('deleted');
  },

  openPush: () => {
    S.pushVisible = false;
    if (!S.user) { S.openFromPush = true; return go('signin'); }
    if (!S.user.profileCompleted) return go('onboarding');
    go('apartments'); loadList('live'); const sc = $('#app .scroll'); if (sc) sc.scrollTop = 0;
  },

  /* DEMO controls */
  demoFill: (d) => { if (S.user) signOut(); S.form = { email: d.email, password: d.pw, showPw: false }; S.formError = null; S.errors = {}; go('signin'); },
  demoGoto: (d) => {
    if (d.route === 'signin') return signOut();
    if (d.route === 'onboarding') { const a = ACCOUNTS[0]; a.profileCompleted = false; S.user = a; S.session = a.email; S.onb = { step: 0, d: emptyDraft() }; return go('onboarding'); }
    if (!S.user || !S.user.profileCompleted) { S.user = ACCOUNTS[1]; S.session = S.user.email; }
    if (!S.list.loadedOnce) { S.list.items = published(); S.list.loadedOnce = true; S.list.status = 'ok'; }
    if (d.route === 'details') { S.detailId = d.id || 'a1'; S.slide = 0; S.video = 'idle'; S.stack = ['apartments']; S.route = 'details'; S.sheet = null; return render(); }
    go(d.route);
  },
  demoNet: (d) => {
    S.net = d.v;
    if (S.user && S.list.loadedOnce) { if (d.v === 'offline') S.list.stale = true; else if (S.list.stale) return loadList('refresh'); }
    render();
  },
  demoData: (d) => { S.demo.aptData = d.v; if (S.user) loadList(S.list.loadedOnce ? 'refresh' : 'initial'); else render(); },
  demoViewings: (d) => { if (!S.user) return toast('(Demo) Sign in first.'); S.user.viewings = d.v === 'some' ? ['a4', 'a1'] : []; render(); },
  demoPush: () => {
    if (S.user && !S.user.notifications) return toast('(Demo) This client has alerts off, so no notification is sent.');
    // The list is a live Convex query: new apartments appear (marked NEW) as soon as they reach Convex, with or without the push.
    S.pushed = true; S.pushVisible = true; render();
    if (S.user && S.list.loadedOnce) loadList("live");
  },
  demoDeactivate: () => { if (!S.user) return toast('(Demo) Nobody is signed in. Try signing in as tom@example.com.'); S.user.active = false; signOut('inactive'); },
  demoUpdate: () => { S.demo.updateRequired = !S.demo.updateRequired; if (S.demo.updateRequired) go('update'); else restore(); },
  demoCold: () => restore(),
  demoScale: (d) => { S.demo.textScale = +d.v; render(); },
  demoSmall: () => { S.demo.small = !S.demo.small; render(); },
  demoVideoFails: () => { S.demo.videoFails = !S.demo.videoFails; render(); },
  demoViewDates: () => { S.demo.viewDates = !S.demo.viewDates; render(); },
  demoPerm: () => { S.demo.perm = 'unasked'; render(); toast('(Demo) Notification permission is back to "not asked yet".'); },
  demoReset: () => location.reload(),
};
function finishOnb() { go('apartments'); loadList('initial'); toast('Profile saved. Welcome, ' + S.user.firstName + '.', 'success'); }

/* ---------------- DEMO panel ---------------- */
function renderDemo() {
  const b = (label, act, args = '', on = false) => `<button class="${on ? 'on' : ''}" data-act="${act}" ${args}>${label}</button>`;
  const pw = 'data-pw="welcome1"';
  $('#demo').innerHTML = `<h2>DEMO CONTROLS</h2><p>Not part of the app. Fake data; every password is <code>welcome1</code>.</p>
    <h3>Sign in as (fills the form)</h3><div class="row">
      ${b('New client → profile completion', 'demoFill', `data-email="anna@example.com" ${pw}`)}${b('Existing client', 'demoFill', `data-email="marko@example.com" ${pw}`)}
      ${b('Wrong password', 'demoFill', 'data-email="marko@example.com" data-pw="nope"')}${b('Account on another phone', 'demoFill', `data-email="lena@example.com" ${pw}`)}${b('Deactivated account', 'demoFill', `data-email="tom@example.com" ${pw}`)}</div>
    <h3>Jump to</h3><div class="row">${b('Cold start (splash)', 'demoCold')}${b('Sign in', 'demoGoto', 'data-route="signin"')}${b('Profile completion', 'demoGoto', 'data-route="onboarding"')}
      ${b('Apartments', 'demoGoto', 'data-route="apartments"')}${b('Details: photos + video + PDF', 'demoGoto', 'data-route="details" data-id="a1"')}${b('Details: Drive video', 'demoGoto', 'data-route="details" data-id="a2"')}
      ${b('Details: no photos, missing data', 'demoGoto', 'data-route="details" data-id="a6"')}${b('Details: very long texts', 'demoGoto', 'data-route="details" data-id="a7"')}${b('Viewings', 'demoGoto', 'data-route="viewings"')}${b('Profile', 'demoGoto', 'data-route="profile"')}</div>
    <h3>Network (applies to the next action)</h3><div class="row">${[['online', 'Online'], ['slow', 'Slow (3.5 s)'], ['offline', 'Offline'], ['error', 'Server error']].map(([v, l]) => b(l, 'demoNet', `data-v="${v}"`, S.net === v)).join('')}</div>
    <h3>Data</h3><div class="row">${b('Apartments: normal', 'demoData', 'data-v="normal"', S.demo.aptData === 'normal')}${b('Apartments: none published', 'demoData', 'data-v="none"', S.demo.aptData === 'none')}
      ${b('My viewings: none', 'demoViewings', 'data-v="none"')}${b('My viewings: two', 'demoViewings', 'data-v="some"')}${b('Viewing day set by staff', 'demoViewDates', '', S.demo.viewDates)}</div>
    <h3>Events</h3><div class="row">${b('Push: “new apartments” arrives', 'demoPush')}${b('Staff deactivate this client', 'demoDeactivate')}${b('Update required', 'demoUpdate', '', S.demo.updateRequired)}
      ${b('Video fails to load', 'demoVideoFails', '', S.demo.videoFails)}${b('Reset notification permission', 'demoPerm')}</div>
    <h3>Display</h3><div class="row">${[[1, 'Text 100%'], [1.3, '130%'], [2, '200%']].map(([v, l]) => b(l, 'demoScale', `data-v="${v}"`, S.demo.textScale === v)).join('')}${b('Small phone (SE)', 'demoSmall', '', S.demo.small)}${b('Reset prototype', 'demoReset')}</div>
    <h3>State</h3><p>Signed in: <b>${S.user ? esc(S.user.email) : 'nobody'}</b> · notification permission: <b>${S.demo.perm}</b></p>`;
}

/* ---------------- events ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.bind) { setPath(t.dataset.bind, t.value); clearErr(t.dataset.bind); }
  else if (t.dataset.num) {
    setPath(t.dataset.num, +t.value); clearErr(t.dataset.num);
    const out = $(`[data-out="${t.dataset.num}"]`); if (out) { out.textContent = sliderText(+t.value, +t.max); out.classList.remove('unset'); }
  } else if (t.dataset.dual) {
    const k = t.dataset.dual; const d = S.draft; let v = +t.value;
    if (t.dataset.end === 'lo') { v = Math.min(v, d[k + 'Max']); d[k + 'Min'] = v; } else { v = Math.max(v, d[k + 'Min']); d[k + 'Max'] = v; }
    t.value = v; syncDuals();
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset?.enter) A[e.target.dataset.enter](); });
window.addEventListener('resize', fit);

restore();
</script>
<script id="kit-assets">
